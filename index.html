<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's Left in My Fridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🧊 ตู้เย็นของฉัน</h1>

  <div id="authBox" class="panel">
    <label class="field" for="email">อีเมล</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label class="field" for="password">รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
    <input id="password" type="password">
    <div class="btnrow">
      <button id="loginBtn">เข้าสู่ระบบ</button>
      <button id="signupBtn" class="secondary">สมัครสมาชิก</button>
    </div>
    <p id="authMsg" class="msg"></p>
  </div>

  <div id="userbar" class="userbar">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="secondary">ออกจากระบบ</button>
  </div>

  <div id="app" style="display:none">
    <p id="appMsg" class="msg"></p>

    <div class="panel">
      <label class="field" for="name">ชื่อวัตถุดิบ</label>
      <input id="name" placeholder="เช่น ไข่">
      <div class="row">
        <div>
          <label class="field" for="qty">จำนวน</label>
          <input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="เช่น 3">
        </div>
        <div>
          <label class="field" for="unit">หน่วย</label>
          <input id="unit" placeholder="เช่น ฟอง">
        </div>
      </div>
      <label class="field" for="exp">วันหมดอายุ</label>
      <input id="exp" type="date">
      <button id="add">เพิ่มของ</button>
    </div>

    <ul id="list"></ul>

    <h2>เมนูแนะนำ</h2>
    <div class="modebar">
      <button id="modeBtn" class="secondary">โหมดจับคู่แปลกๆ: ปิด</button>
      <button id="shuffleBtn" class="secondary" style="display:none">สุ่มใหม่</button>
    </div>
    <div id="recipes"></div>
    <div id="odd" style="display:none"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
